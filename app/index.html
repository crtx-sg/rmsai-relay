<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>rmsai — hospital worklist</title>
  <!-- LiveKit browser client (control-plane data channel for the live worklist). Vendored locally
       (served by the gateway/edge) — no third-party CDN, so no PHI-context request leaves the edge. -->
  <script src="./vendor/livekit-client.umd.min.js"></script>
  <script>
    // Apply the saved theme before first paint (no flash). Storage can be unavailable (private
    // mode, blocked site data): then the OS preference decides, via the CSS below.
    try { const t = localStorage.getItem("rmsai-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <style>
    /* Theme: white (light) or black (dark). Default follows the OS; the header toggle overrides it. */
    :root { color-scheme: light; --bg: #ffffff; --fg: #1b1b1b; --sub: #5f5f5f; --panel: #f3f4f6; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { color-scheme: dark; --bg: #0f1115; --fg: #e8e8e8;
                                        --sub: #a8a8a8; --panel: #1b1e24; }
    }
    :root[data-theme="dark"] { color-scheme: dark; --bg: #0f1115; --fg: #e8e8e8; --sub: #a8a8a8;
                               --panel: #1b1e24; }
    body { font: 14px/1.4 system-ui, sans-serif; margin: 0; background: var(--bg); color: var(--fg); }
    #theme-btn { background: transparent; color: #fff; border: 1px solid #fff6; border-radius: 4px;
                 padding: .15rem .55rem; font-size: .78rem; cursor: pointer; }
    header { display: flex; align-items: center; gap: 1rem; padding: .75rem 1rem;
             background: #14213d; color: #fff; }
    header h1 { font-size: 1rem; margin: 0; font-weight: 600; }
    #status-pill { margin-left: auto; font-size: .8rem; opacity: .85; }
    #login { padding: 2rem 1rem; }
    #login input { font-size: 1rem; padding: .4rem .6rem; width: 8rem; letter-spacing: .3em; }
    #login button { font-size: 1rem; padding: .4rem 1rem; }
    #login .err { color: #c0392b; margin-top: .5rem; min-height: 1.2em; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: .5rem .75rem; border-bottom: 1px solid #8884; }
    th { font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; opacity: .7; }
    tr.acknowledged { opacity: .55; }
    tr.selected { background: #3498db22; }
    .crit { font-weight: 600; }
    .crit-Critical { color: #c0392b; }
    .crit-High { color: #e67e22; }
    /* Rhythm confidence: quiet when the model is sure, marked when it isn't — an uncertain read
       must not look like an asserted finding (it can reach the worklist on the vitals override). */
    .conf { font-variant-numeric: tabular-nums; color: var(--sub); }
    .conf.low { color: #c0392b; font-weight: 600; }
    /* Vitals-driven alert: the vital is the claim, the rhythm is only a suggestion. */
    .vitals-led { display: block; font-weight: 600; color: #8e44ad; }
    .sub { display: block; font-size: .74rem; color: var(--sub); }
    .badge { font-size: .7rem; padding: .1rem .45rem; border-radius: 999px; border: 1px solid #8886; }
    .badge.new { background: #e67e2222; border-color: #e67e22; }
    .badge.acknowledged { background: #27ae6022; border-color: #27ae60; }
    td button { font-size: .72rem; margin-right: .25rem; padding: .15rem .5rem; }
    #empty { padding: 2rem 1rem; opacity: .6; }
    .hidden { display: none; }
    #detail { padding: 1rem; border-top: 3px solid #14213d; }
    #detail h2 { font-size: .85rem; margin: 0 0 .5rem; }
    #detail img { max-width: 100%; border: 1px solid #8884; }
    #detail pre { white-space: pre-wrap; background: #8881; padding: .75rem; border-radius: 4px;
                  max-height: 22rem; overflow: auto; }
    #detail .meta { font-size: .8rem; opacity: .7; margin-bottom: .5rem; }
    svg.spark { width: 100%; height: 120px; background: #8881; border-radius: 4px; }
    svg.spark polyline { fill: none; stroke: #e67e22; stroke-width: 2; }
    #chat { padding: 1rem; border-top: 3px solid #14213d; }
    #chat h2 { font-size: .85rem; margin: 0 0 .5rem; }
    #chat-log { display: flex; flex-direction: column; gap: .4rem; max-height: 16rem;
                overflow: auto; margin-bottom: .6rem; }
    #chat-log .msg { padding: .35rem .6rem; border-radius: 8px; max-width: 80%; }
    #chat-log .clinician { align-self: flex-end; background: #3498db22; }
    #chat-log .assistant { align-self: flex-start; background: #8881; }
    #chat-controls { display: flex; gap: .5rem; align-items: center; }
    #chat-input { flex: 1; padding: .45rem .6rem; font-size: .9rem; }
    #ptt { padding: .45rem .8rem; user-select: none; }
    #ptt.talking { background: #c0392b; color: #fff; }
    /* --- why / source / outcome on worklist rows --- */
    .why { display: block; font-size: .74rem; color: var(--sub); max-width: 46rem; overflow: hidden;
           text-overflow: ellipsis; white-space: nowrap; }
    /* trend samples (the readings behind "rising"/"falling") */
    .info details { margin: .15rem 0; }
    .info details summary { cursor: pointer; }
    .info .samples { font-size: .74rem; color: var(--sub); font-variant-numeric: tabular-nums;
                     background: var(--panel); padding: .3rem .5rem; border-radius: 4px; margin: .2rem 0; }
    svg.mini { width: 14rem; height: 2.4rem; vertical-align: middle; }
    svg.mini polyline { fill: none; stroke: #e67e22; stroke-width: 1.5; }
    .src { font-size: .68rem; padding: .05rem .4rem; border-radius: 4px; background: #2980b922;
           border: 1px solid #2980b966; margin-right: .3rem; white-space: nowrap; }
    .oc { font-size: .68rem; padding: .05rem .4rem; border-radius: 4px; border: 1px solid #8886;
          white-space: nowrap; font-weight: 600; }
    .oc-TP { background: #27ae6022; border-color: #27ae60; }
    .oc-TN { background: #27ae6014; border-color: #27ae6099; }
    .oc-TP_WRONG_CLASS { background: #f1c40f22; border-color: #d4ac0d; }
    .oc-FP, .oc-FN { background: #c0392b22; border-color: #c0392b; }
    .oc-UNSCORABLE { opacity: .6; }
    /* --- tabs --- */
    #tabs button { background: transparent; color: #fff; border: 0; border-bottom: 2px solid transparent;
                   padding: .3rem .6rem; font-size: .85rem; cursor: pointer; opacity: .75; }
    #tabs button.active { border-bottom-color: #fff; opacity: 1; }
    /* --- explanation panel --- */
    .info h3 { font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; opacity: .7;
               margin: .9rem 0 .3rem; }
    .info .headline { font-weight: 600; }
    .info dl { display: grid; grid-template-columns: max-content 1fr; gap: .15rem .9rem; margin: 0;
               font-size: .82rem; }
    .info dt { opacity: .65; }
    .info ul { margin: .2rem 0; padding-left: 1.2rem; font-size: .82rem; }
    /* --- performance view --- */
    #perf-view { padding: 1rem; }
    #perf-filters { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; margin-bottom: 1rem; }
    #perf-filters select, #perf-filters button { font-size: .85rem; padding: .25rem .5rem; }
    .model-block { border: 1px solid #8884; border-radius: 6px; padding: .8rem 1rem; margin-bottom: 1rem; }
    .model-block h2 { font-size: .9rem; margin: 0 0 .2rem; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(10.5rem, 1fr)); gap: .5rem;
             margin: .6rem 0; }
    .tile { border: 1px solid #8884; border-radius: 6px; padding: .45rem .6rem; }
    .tile .k { font-size: .68rem; text-transform: uppercase; letter-spacing: .05em; opacity: .65; }
    .tile .v { font-size: 1.25rem; font-weight: 600; font-variant-numeric: tabular-nums; }
    .tile .ci { font-size: .7rem; opacity: .65; }
    .small-n { font-size: .78rem; color: #b9770e; margin: .3rem 0; }
    table.cm, table.pc { width: auto; margin: .4rem 0 .8rem; font-size: .78rem; }
    table.cm td, table.cm th, table.pc td, table.pc th { padding: .2rem .5rem; text-align: center; }
    table.cm td.diag { background: #27ae6026; font-weight: 600; }
    table.cm td.off { background: #c0392b1a; }
    #perf-events tbody tr { cursor: pointer; }
    #perf-detail { padding: 1rem; border-top: 3px solid #14213d; margin-top: 1rem; }
  </style>
</head>
<body>
  <header>
    <h1>rmsai worklist</h1>
    <nav id="tabs" class="hidden">
      <button data-tab="worklist" class="active">Worklist</button>
      <button data-tab="perf">Model performance</button>
    </nav>
    <span id="room-label"></span>
    <button id="theme-btn" title="Switch background">◐ Theme</button>
    <span id="status-pill">not connected</span>
  </header>

  <section id="login">
    <label>Enter PIN to view the worklist:
      <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" />
    </label>
    <button id="login-btn">Connect</button>
    <div class="err" id="login-err"></div>
  </section>

  <main id="worklist" class="hidden">
   <div id="wl-view">
    <div id="empty">Waiting for critical events…</div>
    <table id="table" class="hidden">
      <thead>
        <tr><th>Patient</th><th>Bed</th><th>Event</th><th>Conf.</th><th>Criticality</th><th>Time</th><th>Status</th><th></th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <section id="detail" class="hidden"></section>
    <section id="chat" class="hidden">
      <h2 id="chat-title">Chat</h2>
      <div id="chat-log"></div>
      <div id="chat-controls">
        <input id="chat-input" type="text" placeholder="Ask about this patient…" autocomplete="off" />
        <button id="chat-send">Send</button>
        <button id="ptt" title="Hold to talk">🎤 Hold to talk</button>
      </div>
    </section>
   </div>
   <div id="perf-view" class="hidden">
     <div id="perf-filters">
       <label>Processed <select id="f-since">
         <option value="">all time</option><option value="1h">last hour</option>
         <option value="24h">last 24 h</option><option value="7d">last 7 days</option>
       </select></label>
       <label>Dataset <select id="f-dataset"><option value="">all</option></select></label>
       <label>Model <select id="f-model"><option value="">all</option></select></label>
       <button id="f-refresh">Refresh</button>
       <span id="perf-status" class="meta"></span>
     </div>
     <div id="perf-models"></div>
     <h2 style="font-size:.85rem;margin:.5rem 0">Labelled events (alerted or not)</h2>
     <table id="perf-events">
       <thead><tr><th>Processed</th><th>Patient</th><th>Outcome</th><th>Predicted</th><th>Truth</th>
         <th>Alert</th><th>Source</th><th>Why</th></tr></thead>
       <tbody></tbody>
     </table>
     <section id="perf-detail" class="hidden"></section>
   </div>
  </main>

  <script src="./app.js"></script>
</body>
</html>
