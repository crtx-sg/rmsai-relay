# Standalone coturn (TURN/STUN) for remote WebRTC through NAT — an alternative to LiveKit's built-in
# TURN. Use this OR `turn.enabled: true` in livekit.public.yaml, not both on the same ports.
# When using coturn, set `turn: { enabled: false }` in livekit.public.yaml and add coturn to the
# clients' ICE servers (LiveKit passes external TURN via its `turn_servers` config / room options).
# Edit every `# EDIT` line for your host.

listening-port=3478
tls-listening-port=5349

# The host's PUBLIC IP (ICE relay candidates are advertised with this).
external-ip=203.0.113.10        # EDIT

realm=livekit.example.com       # EDIT: your FQDN
server-name=livekit.example.com # EDIT

# Auth: shared-secret (time-limited credentials), must match what LiveKit/clients use.
use-auth-secret
static-auth-secret=CHANGE_ME_LONG_RANDOM   # EDIT: long random; keep secret

# TLS (real PHI): point at the same certs as the edge/LiveKit.
cert=/etc/coturn/certs/fullchain.pem       # EDIT / mount
pkey=/etc/coturn/certs/privkey.pem         # EDIT / mount

# Relay port range — forward these UDP ports on the firewall.
min-port=49160
max-port=49200

# Hardening.
no-cli
no-multicast-peers
fingerprint
# Deny relaying to internal ranges so TURN can't be abused to reach your private network.
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
