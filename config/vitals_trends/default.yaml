# Vital-trend policy: when does a vital's history count as clinically *deteriorating*?
# Full explanation: README.md, "Vital trends: when is a vital deteriorating?"
#
# Each event carries 10-30 readings per vital. A vital is deteriorating only when ALL of these hold:
#   1. consistent:   Mann-Kendall p < alpha
#   2. big enough:   |change over the window| >= min_change
#                    (time-based Sen's slope x span, so uneven reading intervals are handled)
#   3. abnormal:     the latest reading is outside `normal` AND moving further away from it
# A latest reading inside `normal` is never deteriorating. Moving back toward `normal` by at least
# min_change is "improving". Anything else is "stable", and the event records the reason:
#   not_significant   no consistent drift (p >= alpha)
#   below_min_change  consistent, but smaller than min_change
#   within_normal     big enough, but the latest reading is inside `normal`
#   toward_normal     improving
#   away_from_normal  deteriorating
# A deteriorating vital escalates the event to at least High (CRITICALITY_ESCALATE_ON_DETERIORATING).
#
# What the p-value is NOT: a measure of size. It says how unlikely a drift this consistent is by
# chance; with 25 readings a steady 1-2 breaths/min drift scores p < 0.001. That is why min_change
# exists. The app shows p only as a tooltip.
#
# Trend vs level: MEWS scores each vital's *current level*, independently of this file. RR at a steady
# 23-25 /min scores 2 MEWS points while its trend here is below_min_change. Both are correct.
#
# ---- Per-hospital overrides ----------------------------------------------------------------------
# This file is the default for every hospital. To tune one, create `<HOSPITAL_ID>.yaml` next to it
# with only the keys that differ; it is merged over this file key by key. Example, h1.yaml:
#
#   alpha: 0.01
#   vitals:
#     RespRate: {min_change: 3}
#     HR: {normal: [55, 100]}
#
# Rules: `normal` is inclusive [low, high] with low < high; min_change > 0; 0 < alpha < 1. A vital
# added here needs both min_change and normal. An invalid file stops the producer at startup.
# Changes apply to events analysed AFTER a restart (`make docker-restart` / re-run cli.ingest);
# stored events keep the verdict they were given.
#
# ---- Where the defaults come from -----------------------------------------------------------------
# `normal`: the MEWS 0-score bands (ecgtranscnn.mews), except Diastolic, which MEWS does not score
#   (60-90 mmHg is a conventional range).
# `min_change`: POC starting values pending clinical sign-off.
#
# Simulator caveat: simulated Diastolic BP is 35-49 mmHg for nearly every patient, below the 60-90
# range, so any 10 mmHg drift in it is flagged. Left as is deliberately; to quiet it for a demo, set
# `Diastolic: {normal: [30, 90]}` in the hospital file.

alpha: 0.05

vitals:
  HR:        {min_change: 10,  normal: [51, 100],   unit: bpm}
  RespRate:  {min_change: 4,   normal: [9, 14],     unit: /min}
  SpO2:      {min_change: 3,   normal: [94, 100],   unit: "%"}
  Systolic:  {min_change: 20,  normal: [101, 200],  unit: mmHg}
  Diastolic: {min_change: 10,  normal: [60, 90],    unit: mmHg}
  Temp:      {min_change: 1.0, normal: [95.0, 101.1], unit: °F}
